name: NOXRIDGE Backend CI

on:
  push:
    branches:
      - main
      - "noxridge/**"
  pull_request:
    branches:
      - main

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The syntax check and mocked Creator Store tests use only Node.js built-ins.
      # Do not resolve/install the backend's production dependency tree in this job.
      - name: Check JavaScript syntax
        run: npm run check

      - name: Run Creator Store publication tests
        run: npm test
